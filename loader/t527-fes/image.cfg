; Minimal Avaota A1 / T527 IMAGEWTY package used only for FEL -> FES.
; It intentionally contains no Boot0, MBR, partition, kernel or rootfs.

[MAIN_TYPE]
ITEM_COMMON = "COMMON  "
ITEM_FES    = "FES     "

[DIR_DEF]
INPUT_DIR = "../"

[FILELIST]
    {filename = "config.fex", maintype = ITEM_COMMON, subtype = "SYS_CONFIG_BIN00",},
    {filename = "board.fex",  maintype = ITEM_COMMON, subtype = "BOARD_CONFIG_BIN",},
    {filename = "sunxi.fex",  maintype = ITEM_COMMON, subtype = "DTB_CONFIG000000",},
    {filename = "u-boot.fex", maintype = "12345678", subtype = "UBOOT_0000000000",},
    {filename = "fes1.fex",   maintype = ITEM_FES,    subtype = "FES_1-0000000000",},

[IMAGE_CFG]
version = 0x100234
pid = 0x00001234
vid = 0x00008743
hardwareid = 0x100
firmwareid = 0x100
filelist = FILELIST
encrypt = 0
imagename = avaota-a1-t527-fes-loader.img
