image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"Image",
			"sun55i-t527-avaota-a1.dtb",
			"extlinux"
		}
	}
	size = 240M
}

image avaota-a1-full-mainline.img {
	hdimage {}

	partition mainline-uboot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
		offset = 256M
	}
}
